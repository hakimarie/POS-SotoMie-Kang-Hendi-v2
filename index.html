<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9f2d20">
<title>Kasir Kang Hendi 2</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root{--bg:#f7f5f2;--card:#fff;--ink:#1c1917;--muted:#78716c;--line:#e7e2dc;--primary:#b42318;--accent:#f79009;--ok:#067647;--radius:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
header .t{font-weight:700;font-size:15px;line-height:1.2}
header .s{font-size:12px;opacity:.85}
header .sp{flex:1}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;padding:8px 10px;border-radius:10px;font-size:13px}
main{padding:12px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted);font-size:13px}
.hidden{display:none!important}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:15px;font-weight:600}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{background:#fff;border-color:#f3b4ae;color:var(--primary)}
.btn.big{width:100%;padding:16px;font-size:17px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btnrow .btn{flex:1;min-width:100px}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.seg button.active{background:#fbeeec;border-color:var(--primary);color:var(--primary)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.prod{text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:84px}
.prod:active{transform:scale(.98)}
.prod .pname{font-weight:700;font-size:15px}
.prod .pprice{color:var(--muted);font-size:13px}
.cart .row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line)}
.cart .row:first-of-type{border-top:0}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;line-height:1}
.qty b{min-width:22px;text-align:center}
.item-main{flex:1;min-width:0}
.item-name{font-weight:600;font-size:14px}
.item-note{font-size:12px;color:var(--accent);font-weight:600}
.item-sub{font-size:13px;color:var(--muted);white-space:nowrap}
.totalrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:17px;font-weight:700}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button .ico{font-size:20px;line-height:1}
.tabs button.active{color:var(--primary);font-weight:700}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(20,15,10,.45)}
.sheet{position:relative;background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet-head{display:flex;align-items:center;margin-bottom:8px}
.sheet-head h2{flex:1;margin:0}
.x{border:0;background:#f2ede8;width:34px;height:34px;border-radius:50%;font-size:15px}
.total-big{font-size:28px;font-weight:800;text-align:center;margin:6px 0 14px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],input[type=date],input[type=password],select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;color:var(--ink)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.quick button{flex:1;min-width:78px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#faf7f4;font-weight:600;font-size:13px}
.change{padding:12px 0;font-size:16px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink);margin-top:10px}
.check input{width:22px;height:22px}
.receipt{background:#fbf9f7;border:1px dashed var(--line);border-radius:12px;padding:14px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;margin:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
td.r,th.r{text-align:right}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .lbl{font-size:12px;color:var(--muted)}
.kpi .val{font-size:19px;font-weight:800}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;background:#fbeeec;color:var(--primary)}
.badge.ok{background:#e7f6ec;color:var(--ok)}
.badge.grey{background:#f2ede8;color:var(--muted)}
.txrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.txrow:first-child{border-top:0}
.txrow .m{flex:1;min-width:0}
.txrow .n{font-weight:700;font-size:14px}
.txrow .d{font-size:12px;color:var(--muted)}
.txrow.void .n{text-decoration:line-through;color:var(--muted)}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lock .box{width:100%;max-width:340px;text-align:center}
.pin{font-size:28px;letter-spacing:.4em;text-align:center}
.warn{background:#fff7e6;border:1px solid #f7d08a;color:#8a5300;padding:10px 12px;border-radius:12px;font-size:13px;margin-bottom:12px}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;inset:0;padding:0;font:12px/1.45 ui-monospace,monospace;white-space:pre-wrap}
}

:root{--bg:#f4f1eb;--card:#fffdf9;--ink:#211b16;--muted:#7b7066;--line:#e8dfd3;--primary:#9f2d20;--accent:#c47b26;--ok:#16734b;--radius:18px}
body{background:radial-gradient(ellipse at top,#fffaf1 0%,var(--bg) 52%);padding-bottom:92px}
header{background:linear-gradient(115deg,#7d2119,#a93424 62%,#c04b2d);padding:15px 18px;box-shadow:0 8px 24px rgba(91,31,22,.18)}header .t{font-size:16px;letter-spacing:-.02em}header .s{font-size:12px;opacity:.9}
main{max-width:980px;padding:16px}.card{border-color:rgba(116,83,54,.12);box-shadow:0 5px 18px rgba(52,36,22,.045);padding:16px}
.btn{border-radius:14px;transition:transform .12s ease,box-shadow .12s ease}.btn:active{transform:translateY(1px)}.btn.primary{background:linear-gradient(135deg,#9f2d20,#bd452c);box-shadow:0 5px 14px rgba(159,45,32,.18)}
.seg button{border-radius:14px;background:#fffdf9}.seg button.active{background:#f8e9e2;border-color:#d8a095;color:#8e281d}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}.prod{border-radius:17px;min-height:102px;padding:16px;background:linear-gradient(160deg,#fffdf9,#fff8ef);border-color:#eadfd1;box-shadow:0 3px 10px rgba(45,29,16,.035)}.prod:active{transform:scale(.985)}.prod .pname{font-size:15px;line-height:1.3}.prod .pprice{font-size:14px;color:#8d4b2f;font-weight:700}
.cart{background:#fffdf9}.totalrow{font-size:18px}.tabs{background:rgba(255,253,249,.96);backdrop-filter:blur(14px);border-top-color:#e6ddd2;box-shadow:0 -8px 24px rgba(45,29,16,.05)}.tabs button{padding-top:11px}.tabs button.active{color:#9f2d20}.tabs button .ico{font-size:21px}
.kpi{gap:10px}.kpi .box{border-radius:16px;background:linear-gradient(145deg,#fffdf9,#fff8ef);border-color:#eadfd1;padding:14px}.kpi .val{font-size:20px;letter-spacing:-.03em}
.v2-hero{background:linear-gradient(130deg,#3a211b,#6c2a20 58%,#9f3928);color:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 10px 24px rgba(77,35,25,.15)}.v2-hero .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.72;font-weight:700}.v2-hero .headline{font-size:20px;font-weight:800;letter-spacing:-.035em;margin:4px 0 3px}.v2-hero .sub{font-size:12px;opacity:.78}.v2-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}.v2-stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:10px;min-width:0}.v2-stat .label{font-size:10px;opacity:.72}.v2-stat .value{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.v2-hero{padding:22px}.v2-hero .headline{font-size:24px}}@media(max-width:380px){main{padding:10px}.prod{padding:12px}.v2-stat{padding:8px}.v2-stat .value{font-size:13px}}

</style>
</head>
<body>
<div id="lock" class="lock hidden">
  <div class="box">
    <div style="font-size:34px">🔒</div>
    <h2 style="margin:6px 0 2px">Kasir Kang Hendi</h2>
    <p class="muted">Masukkan PIN untuk membuka</p>
    <input id="pinInput" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" onkeydown="if(event.key==='Enter')unlock()">
    <p id="pinErr" class="muted" style="color:var(--primary);min-height:20px"></p>
    <button class="btn primary big" onclick="unlock()">Buka</button>
  </div>
</div>

<header>
  <div>
    <div class="t" id="hName">Kasir</div>
    <div class="s" id="hSub"></div>
  </div>
  <div class="sp"></div>
  <button onclick="lockApp()">Kunci</button>
</header>

<main id="app"></main>

<nav class="tabs" id="tabs">
  <button data-tab="kasir" class="active" onclick="go('kasir')"><span class="ico">🧾</span>Kasir</button>
  <button data-tab="riwayat" onclick="go('riwayat')"><span class="ico">📋</span>Riwayat</button>
  <button data-tab="laporan" onclick="go('laporan')"><span class="ico">📊</span>Laporan</button>
  <button data-tab="atur" onclick="go('atur')"><span class="ico">⚙️</span>Atur</button>
</nav>

<div id="modal" class="modal hidden"></div>
<div id="printArea"></div>

<script>
/* ================= util ================= */
var LS_KEY='skh_v2';
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmtTime(ts){var d=new Date(ts);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function rid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ================= data ================= */
function defaults(){
  return {
    v:1,
    settings:{warung:'Soto Mie & Soto Tangkar Kang Hendi',alamat:'',telepon:'',pin:'',footer:'Terima kasih!'},
    products:[
      {id:'p1',name:'Soto Tangkar',price:25000,cat:'Soto'},
      {id:'p2',name:'Soto Mie',price:16000,cat:'Soto'},
      {id:'p3',name:'Nasi',price:5000,cat:'Tambahan'},
      {id:'p4',name:'Risol (3 pcs)',price:5000,cat:'Tambahan'},
      {id:'p5',name:'Es Teh Manis',price:5000,cat:'Minuman'},
      {id:'p6',name:'Es Teh Tawar',price:3000,cat:'Minuman'},
      {id:'p7',name:'Teh Manis Hangat',price:4000,cat:'Minuman'},
      {id:'p8',name:'Es Jeruk',price:5000,cat:'Minuman'},
      {id:'p9',name:'Jeruk Hangat',price:5000,cat:'Minuman'},
      {id:'p10',name:'Nutrisari',price:5000,cat:'Minuman'}
    ],
    tx:[]
  };
}
var S;
function normalize(o){
  var d=defaults();
  o.settings=Object.assign(d.settings,o.settings||{});
  o.products=Array.isArray(o.products)&&o.products.length?o.products:d.products;
  o.tx=Array.isArray(o.tx)?o.tx:[];
  return o;
}
function load(){
  var raw=localStorage.getItem(LS_KEY);
  if(!raw){S=defaults();save();return}
  try{S=normalize(JSON.parse(raw))}catch(e){S=defaults();save()}
}
function save(){
  try{
    localStorage.setItem(LS_KEY,JSON.stringify(S));
    return true;
  }catch(e){
    alert('Gagal menyimpan data ke perangkat. Penyimpanan mungkin penuh atau dibatasi browser. Jangan tutup aplikasi; segera ekspor backup dan kosongkan ruang.');
    return false;
  }
}

/* ================= state ================= */
var cart=[];
var orderType='DINE_IN';
var tab='kasir';
var histRange='today';
var repFrom=null,repTo=null;
var pay={method:'CASH',cash:0,qrisOk:false};
var currentReceipt='';
var pinFails=0;
var pinBlockedUntil=0;
var PIN_LOCK_KEY='skh_v2_pin_lockout';
var PIN_ITERATIONS=150000;
function bytesToHex(buffer){
  return Array.prototype.map.call(new Uint8Array(buffer),function(b){return b.toString(16).padStart(2,'0')}).join('');
}
function hexToBytes(value){
  if(typeof value!=='string'||!/^(?:[0-9a-f]{2})+$/i.test(value))throw new Error('Invalid salt');
  var out=new Uint8Array(value.length/2);
  for(var i=0;i<out.length;i++)out[i]=parseInt(value.substr(i*2,2),16);
  return out;
}
async function hashPin(pin){
  if(!window.crypto||!crypto.subtle||!crypto.getRandomValues||!window.TextEncoder)throw new Error('Web Crypto unavailable');
  var salt=crypto.getRandomValues(new Uint8Array(16));
  var key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:PIN_ITERATIONS,hash:'SHA-256'},key,256);
  return 'pbkdf2$'+PIN_ITERATIONS+'$'+bytesToHex(salt)+'$'+bytesToHex(bits);
}
async function verifyPin(pin,stored){
  if(typeof stored!=='string'||!stored)return false;
  if(stored.indexOf('pbkdf2$')!==0)return pin===stored;
  var parts=stored.split('$'),iterations=Number(parts[1]);
  if(parts.length!==4||!Number.isInteger(iterations)||iterations<100000||iterations>1000000||!/^[0-9a-f]{64}$/i.test(parts[3]))return false;
  if(!window.crypto||!crypto.subtle||!window.TextEncoder)return false;
  try{
    var key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
    var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:hexToBytes(parts[2]),iterations:iterations,hash:'SHA-256'},key,256);
    var actual=bytesToHex(bits),expected=parts[3].toLowerCase(),diff=0;
    for(var i=0;i<actual.length;i++)diff|=actual.charCodeAt(i)^expected.charCodeAt(i);
    return diff===0;
  }catch(e){return false}
}
function readPinThrottle(){
  try{
    var x=JSON.parse(localStorage.getItem(PIN_LOCK_KEY)||'null');
    if(x&&Number.isInteger(x.fails)&&Number.isFinite(x.blockedUntil))return x;
  }catch(e){}
  return {fails:pinFails,blockedUntil:pinBlockedUntil};
}
function writePinThrottle(x){
  pinFails=x.fails;pinBlockedUntil=x.blockedUntil;
  try{localStorage.setItem(PIN_LOCK_KEY,JSON.stringify(x))}catch(e){}
}
var savingTx=false;

/* ================= helpers ================= */
function prodById(id){return S.products.filter(function(p){return p.id===id})[0]}
function findTx(id){return S.tx.filter(function(t){return t.id===id})[0]}
function cartTotal(){return cart.reduce(function(s,c){var p=prodById(c.pid);return s+((p&&p.price||0)*c.qty)},0)}

/* ================= cart actions ================= */
function addToCart(id){
  var product=prodById(id);
  if(!product)return;
  if(!Number.isSafeInteger(Number(product.price))||Number(product.price)<=0){
    alert('Harga produk belum valid. Isi harga di Atur → Produk sebelum menambahkan menu.');
    return;
  }
  var it=cart.filter(function(c){return c.pid===id})[0];
  if(it)it.qty++;else cart.push({pid:id,qty:1,note:''});
  render();
}
function incQty(id){var it=cart.filter(function(c){return c.pid===id})[0];if(it){it.qty++;render()}}
function decQty(id){
  var it=cart.filter(function(c){return c.pid===id})[0];if(!it)return;
  it.qty--;if(it.qty<=0)cart=cart.filter(function(c){return c.pid!==id});
  render();
}
function rmItem(id){cart=cart.filter(function(c){return c.pid!==id});render()}
function noteItem(id){
  var it=cart.filter(function(c){return c.pid===id})[0];if(!it)return;
  var p=prodById(id)||{name:''};
  var n=prompt('Catatan untuk '+p.name+'\n(misal: tanpa mie, es sedikit)',it.note||'');
  if(n!==null){it.note=n.trim();render()}
}
function setOrderType(t){orderType=t;render()}

/* ================= navigation ================= */
function go(t){tab=t;window.scrollTo(0,0);render()}

/* ================= render ================= */
function render(){
  S.settings.warung=S.settings.warung||'Kasir';
  $('#hName').textContent=S.settings.warung;
  $('#hSub').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab)});
  var app=$('#app');
  if(tab==='kasir')app.innerHTML=renderKasir();
  else if(tab==='riwayat')app.innerHTML=renderRiwayat();
  else if(tab==='laporan')app.innerHTML=renderLaporan();
  else app.innerHTML=renderAtur();
}

function renderKasir(){
  var anyZero=S.products.some(function(p){return !p.price});
  var h='';
  var today=ymd(new Date());
  var todayTx=S.tx.filter(function(t){return ymd(new Date(t.ts))===today&&!t.voided});
  var todaySales=todayTx.reduce(function(sum,t){return sum+Number(t.total||0)},0);
  h+='<section class="v2-hero"><div class="eyebrow">Ringkasan hari ini</div><div class="headline">Kasir siap melayani</div><div class="sub">Transaksi tetap tersimpan di perangkat ini</div><div class="v2-stats">'
    +'<div class="v2-stat"><div class="label">Penjualan</div><div class="value">'+money(todaySales)+'</div></div>'
    +'<div class="v2-stat"><div class="label">Transaksi</div><div class="value">'+todayTx.length+'</div></div>'
    +'<div class="v2-stat"><div class="label">Rata-rata</div><div class="value">'+money(todayTx.length?Math.round(todaySales/todayTx.length):0)+'</div></div>'
    +'</div></section>';
  if(anyZero)h+='<div class="warn">Harga menu belum diisi. Buka <b>Atur → Produk</b> untuk mengisi harga.</div>';
  h+='<div class="seg">'
    +'<button class="'+(orderType==='DINE_IN'?'active':'')+'" onclick="setOrderType(\'DINE_IN\')">Makan di sini</button>'
    +'<button class="'+(orderType==='TAKEAWAY'?'active':'')+'" onclick="setOrderType(\'TAKEAWAY\')">Bawa pulang</button>'
    +'</div>';
  h+='<div class="grid">'+S.products.map(function(p){
    return '<button class="prod" onclick="addToCart(\''+p.id+'\')">'
      +'<span class="pname">'+esc(p.name)+'</span>'
      +'<span class="pprice">'+(p.price?money(p.price):'harga belum diisi')+'</span>'
      +'</button>';
  }).join('')+'</div>';
  h+='<div class="card cart"><h3>Pesanan · '+(orderType==='DINE_IN'?'Makan di sini':'Bawa pulang')+'</h3>';
  if(!cart.length){
    h+='<p class="muted">Belum ada item. Ketuk menu di atas untuk menambah.</p>';
  }else{
    h+=cart.map(function(c){
      var p=prodById(c.pid)||{name:'(menu dihapus)',price:0};
      return '<div class="row">'
        +'<div class="qty"><button onclick="decQty(\''+c.pid+'\')">−</button><b>'+c.qty+'</b><button onclick="incQty(\''+c.pid+'\')">+</button></div>'
        +'<div class="item-main"><div class="item-name">'+esc(p.name)+'</div>'
        +(c.note?'<div class="item-note">Catatan: '+esc(c.note)+'</div>':'')

    +'<div class="box"><div class="lbl">QRIS</div><div class="val">'+money(qris)+'</div></div>'

  h+='<div class="card"><h3>Per produk</h3>';

/* ================= checkout ================= */
function openCheckout(){
  if(!cart.length){alert('Pesanan masih kosong.');return}
  if(cart.some(function(c){var p=prodById(c.pid);return !p||!Number.isSafeInteger(Number(p.price))||Number(p.price)<=0})){
    alert('Ada menu dengan harga tidak valid. Periksa Atur → Produk.');
    return;
  }
  var total=cartTotal();
  if(!Number.isSafeInteger(total)||total<=0){alert('Total transaksi tidak valid.');return}
  pay={method:'CASH',cash:0,qrisOk:false};
  var quicks=[total,20000,50000,100000].filter(function(v,i,a){return v>0&&a.indexOf(v)===i});
  openModal(
    '<div class="sheet-head"><h2>Pembayaran</h2><button class="x" onclick="closeModalForce()">✕</button></div>'
    +'<div class="total-big">'+money(total)+'</div>'
    +'<div class="seg">'
    +'<button id="segCash" class="active" onclick="setPay(\'CASH\')">Tunai</button>'
    +'<button id="segQris" onclick="setPay(\'QRIS\')">QRIS</button>'
    +'</div>'
    +'<div id="cashBox">'
    +'<label>Uang diterima</label>'
    +'<input id="cashInput" type="number" inputmode="numeric" oninput="onCash(this.value)" placeholder="0">'
    +'<div class="quick">'+quicks.map(function(v){return '<button onclick="setCash('+v+')">'+money(v)+'</button>'}).join('')+'</div>'
    +'<div class="change">Kembalian: <b id="changeVal">—</b></div>'
    +'</div>'
    +'<div id="qrisBox" class="hidden">'
    +'<p class="muted">Tunjukkan QRIS warung. Setelah dana dipastikan masuk, centang konfirmasi di bawah.</p>'
    +'<label class="check"><input type="checkbox" id="qrisChk" onchange="pay.qrisOk=this.checked"> Dana QRIS sudah diterima</label>'
    +'</div>'
    +'<button class="btn primary big" style="margin-top:14px" onclick="saveTx()">Simpan Transaksi</button>'
  );
  setTimeout(function(){var el=$('#cashInput');if(el)el.focus()},50);
}
function setPay(m){
  pay.method=m;
  $('#segCash').classList.toggle('active',m==='CASH');
  $('#segQris').classList.toggle('active',m==='QRIS');
  $('#cashBox').classList.toggle('hidden',m!=='CASH');
  $('#qrisBox').classList.toggle('hidden',m!=='QRIS');
}
function onCash(v){
  pay.cash=Number(v||0);
  var total=cartTotal();
  var el=$('#changeVal');
  if(pay.cash>=total)el.textContent=money(pay.cash-total);
  else el.textContent='—';
}
function setCash(v){
  var el=$('#cashInput');if(!el)return;
  el.value=v;onCash(v);
}

function saveTx(){
  if(savingTx)return;
  var total=cartTotal();
  if(!cart.length){alert('Pesanan kosong.');return}
  if(!Number.isSafeInteger(total)||total<=0){alert('Total harus lebih dari Rp 0 dan berupa angka bulat.');return}
  if(cart.some(function(c){var p=prodById(c.pid);return !p||!Number.isSafeInteger(Number(p.price))||p.price<=0||!Number.isInteger(c.qty)||c.qty<1})){
    alert('Item atau harga pesanan tidak valid. Periksa kembali keranjang.');
    return;
  }
  if(pay.method==='CASH'){
    if(!(pay.cash>=total)){alert('Uang diterima kurang dari total.');return}
  }else{
    if(!pay.qrisOk){alert('Centang konfirmasi dana QRIS sudah diterima.');return}
  }
  var d=new Date(),dayKey=ymd(d);
  var seq=S.tx.filter(function(t){return ymd(new Date(t.ts))===dayKey}).length+1;
  var no='SKH-'+dayKey.replace(/-/g,'')+'-'+String(seq).padStart(3,'0');
  var items=cart.map(function(c){
    var p=prodById(c.pid)||{name:'(menu dihapus)',price:0};
    return {pid:c.pid,name:p.name,price:p.price||0,qty:c.qty,note:c.note||''};
  });
  var tx={
    id:'t'+rid(),no:no,ts:d.getTime(),items:items,total:total,
    method:pay.method,
    cash:pay.method==='CASH'?pay.cash:null,
    change:pay.method==='CASH'?pay.cash-total:null,
    orderType:orderType,voided:false,voidedAt:null,voidReason:''
  };
  savingTx=true;
  S.tx.push(tx);
  if(!save()){
    S.tx.pop();
    savingTx=false;
    return;
  }
  savingTx=false;
  cart=[];closeModalForce();render();
  showReceipt(tx);
}

/* ================= receipt ================= */
function receiptText(tx){
  var L=[];
  L.push(S.settings.warung||'Kasir');
  if(S.settings.alamat)L.push(S.settings.alamat);
  if(S.settings.telepon)L.push('Telp/WA: '+S.settings.telepon);
  L.push('--------------------------------');
  L.push('No  : '+tx.no);
  L.push('Tgl : '+fmtTime(tx.ts));
  L.push('Tipe: '+(tx.orderType==='DINE_IN'?'Makan di sini':'Bawa pulang'));
  L.push('--------------------------------');
  tx.items.forEach(function(it){
    L.push(it.name);
    L.push('  '+it.qty+' x '+money(it.price)+' = '+money(it.price*it.qty));
    if(it.note)L.push('  * '+it.note);
  });
  L.push('--------------------------------');
  L.push('TOTAL      : '+money(tx.total));
  if(tx.method==='CASH'){
    L.push('TUNAI      : '+money(tx.cash));
    L.push('KEMBALIAN  : '+money(tx.change));
  }else{
    L.push('BAYAR      : QRIS (diterima)');
  }
  L.push('--------------------------------');
  L.push(S.settings.footer||'Terima kasih!');
  if(tx.voided)L.push('*** TRANSAKSI DIBATALKAN ***');
  return L.join('\n');
}

function showReceipt(tx){
  if(!tx)return;
  currentReceipt=receiptText(tx);
  var h='<div class="sheet-head"><h2>Struk</h2><button class="x" onclick="closeModalForce()">✕</button></div>'
    +'<pre class="receipt">'+esc(currentReceipt)+'</pre>'
    +'<div class="btnrow">'
    +'<button class="btn" onclick="shareReceipt()">Bagikan</button>'
    +'<button class="btn" onclick="copyReceipt()">Salin</button>'
    +'<button class="btn" onclick="printReceipt()">Cetak</button>'
    +'</div>';
  if(!tx.voided){
    h+='<button class="btn danger" style="width:100%" onclick="voidTx(\''+tx.id+'\')">Batalkan Transaksi</button>';
  }
  h+='<button class="btn primary big" style="margin-top:10px" onclick="closeModalForce()">Selesai</button>';
  openModal(h);
}

function shareReceipt(){
  if(navigator.share){
    navigator.share({text:currentReceipt}).catch(function(){});
  }else{
    copyText(currentReceipt);
  }
}
function copyReceipt(){copyText(currentReceipt)}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){alert('Disalin. Tempel di WhatsApp.')},function(){fallbackCopy(t)});
  }else fallbackCopy(t);
}
function fallbackCopy(t){
  var ta=document.createElement('textarea');
  ta.value=t;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');alert('Disalin. Tempel di WhatsApp.')}catch(e){alert('Gagal menyalin')}
  ta.remove();
}
function printReceipt(){
  $('#printArea').textContent=currentReceipt;
  window.print();
}

function voidTx(id){
  var t=findTx(id);if(!t||t.voided)return;
  if(!confirm('Batalkan transaksi '+t.no+' sebesar '+money(t.total)+'?'))return;
  var r=prompt('Alasan pembatalan (opsional):','');
  if(r===null)return;
  var previous={voided:t.voided,voidedAt:t.voidedAt,voidReason:t.voidReason};
  t.voided=true;t.voidedAt=Date.now();t.voidReason=r.trim();
  if(!save()){
    t.voided=previous.voided;t.voidedAt=previous.voidedAt;t.voidReason=previous.voidReason;
    return;
  }
  closeModalForce();render();
  alert('Transaksi dibatalkan. Data tetap tersimpan untuk audit.');
}

/* ================= modal ================= */
function openModal(html){
  $('#modal').innerHTML='<div class="backdrop" onclick="closeModal(event)"></div><div class="sheet">'+html+'</div>';
  $('#modal').classList.remove('hidden');
}
function closeModal(e){
  if(e&&e.target&&!e.target.classList.contains('backdrop'))return;
  closeModalForce();
}
function closeModalForce(){
  $('#modal').classList.add('hidden');
  $('#modal').innerHTML='';
}

/* ================= settings actions ================= */
function saveWarung(){
  var previous=Object.assign({},S.settings);
  S.settings.warung=$('#setWarung').value.trim()||'Kasir';
  S.settings.alamat=$('#setAlamat').value.trim();
  S.settings.telepon=$('#setTelp').value.trim();
  S.settings.footer=$('#setFooter').value.trim();
  if(save()){render();alert('Pengaturan warung disimpan.');}
  else S.settings=previous;
}
async function savePin(){
  var v=$('#setPin').value.trim();
  if(v&&!/^\d{4}$/.test(v)){alert('PIN harus 4 digit angka.');return}
  var old=S.settings.pin;
  try{S.settings.pin=v?await hashPin(v):''}
  catch(e){alert('Tidak dapat mengamankan PIN. Pastikan aplikasi dibuka melalui HTTPS di browser modern.');return}
  if(!save()){S.settings.pin=old;return}
  $('#setPin').value='';
  writePinThrottle({fails:0,blockedUntil:0});
  alert(v?'PIN aktif.':'PIN dinonaktifkan.');
}
function saveProducts(){
  var previousProducts=S.products.map(function(p){return Object.assign({},p)});
  for(var i=0;i<S.products.length;i++){
    var p=S.products[i];
    var n=($('#pn_'+p.id).value||'').trim();
    var rawPrice=$('#pp_'+p.id).value;
    var pr=Number(rawPrice);
    if(!n){
      S.products=previousProducts;
      alert('Nama produk tidak boleh kosong.');
      return;
    }
    if(rawPrice.trim()===''||!Number.isFinite(pr)||pr<0||!Number.isSafeInteger(Math.round(pr))){
      S.products=previousProducts;
      alert('Harga produk harus berupa angka nol atau lebih.');
      return;
    }
    p.name=n;p.price=Math.round(pr);
  }
  if(save()){render();alert('Produk disimpan.');}
  else S.products=previousProducts;
}
function addProduct(){
  var n=($('#newName').value||'').trim();
  var pr=Number($('#newPrice').value||0);
  if(!n){alert('Isi nama produk.');return}
  if(pr<0){alert('Harga tidak boleh negatif.');return}
  var product={id:'p'+rid(),name:n,price:Math.round(pr),cat:''};
  S.products.push(product);
  if(save()){render();alert('Produk ditambahkan.');}
  else S.products.pop();
}
function delProduct(id){
  if(!confirm('Hapus produk ini dari daftar menu? Riwayat transaksi lama tetap aman.'))return;
  var previousProducts=S.products;
  var previousCart=cart;
  S.products=S.products.filter(function(p){return p.id!==id});
  cart=cart.filter(function(c){return c.pid!==id});
  if(save())render();
  else{S.products=previousProducts;cart=previousCart;}
}

/* ================= backup ================= */
function exportJSON(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  download(blob,'kasir-kanghendi-v2-backup-'+ymd(new Date())+'.json');
}
function exportCSV(){
  if(!repFrom){alert('Buka tab Laporan dulu untuk memilih rentang.');return}
  var from=new Date(repFrom+'T00:00:00').getTime();
  var to=new Date(repTo+'T23:59:59.999').getTime();
  var list=S.tx.filter(function(t){return t.ts>=from&&t.ts<=to});
  var head=['No','Tanggal','Tipe','Metode','Total','Status','Detail'];
  var rows=list.map(function(t){
    var det=t.items.map(function(it){return it.name+' x'+it.qty+(it.note?' ('+it.note+')':'')}).join('; ');
    return [t.no,fmtTime(t.ts),t.orderType,t.method,t.total,t.voided?'BATAL':'OK',det];
  });
  var csv=[head].concat(rows).map(function(r){
    return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',');
  }).join('\r\n');
  download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'transaksi-'+repFrom+'_'+repTo+'.csv');
}
function download(blob,name){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}
function validateBackup(obj){
  if(!obj||obj.v!==1||!obj.settings||!Array.isArray(obj.products)||!Array.isArray(obj.tx))return false;
  if(obj.products.length>500||obj.tx.length>50000)return false;
  var ids={};
  for(var i=0;i<obj.products.length;i++){
    var p=obj.products[i];
    if(!p||typeof p.id!=='string'||!/^[a-zA-Z0-9_-]{1,64}$/.test(p.id)||ids[p.id])return false;
    ids[p.id]=true;
    if(typeof p.name!=='string'||!p.name.trim()||p.name.length>120)return false;
    if(!Number.isSafeInteger(Number(p.price))||Number(p.price)<0)return false;
  }
  var txIds={};
  for(var j=0;j<obj.tx.length;j++){
    var t=obj.tx[j];
    if(!t||typeof t.id!=='string'||!/^[a-zA-Z0-9_-]{1,100}$/.test(t.id)||txIds[t.id])return false;
    txIds[t.id]=true;
    if(typeof t.no!=='string'||t.no.length>100||!Number.isFinite(Number(t.ts))||!Array.isArray(t.items))return false;
    if(!Number.isSafeInteger(Number(t.total))||Number(t.total)<0||!['CASH','QRIS'].includes(t.method)||!['DINE_IN','TAKEAWAY'].includes(t.orderType))return false;
    if(t.items.length>200)return false;
    for(var k=0;k<t.items.length;k++){
      var it=t.items[k];
      if(!it||typeof it.name!=='string'||it.name.length>120||!Number.isSafeInteger(Number(it.price))||Number(it.price)<0||!Number.isInteger(Number(it.qty))||Number(it.qty)<1||Number(it.qty)>1000)return false;
      if(it.note!=null&&(typeof it.note!=='string'||it.note.length>500))return false;
    }
  }
  return true;
}
function importJSON(file){
  if(!file)return;
  if(file.size>10*1024*1024){alert('File backup terlalu besar (maksimum 10 MB).');$('#impFile').value='';return}
  var r=new FileReader();
  r.onload=function(){
    try{
      var obj=JSON.parse(r.result);
      if(!validateBackup(obj))throw new Error('Format atau isi backup tidak valid');
      if(!confirm('Ganti semua data saat ini dengan isi backup?\\nProduk: '+obj.products.length+' · Transaksi: '+obj.tx.length))return;
      var previous=S;
      S=normalize(obj);
      if(!save()){S=previous;return}
      render();alert('Backup dipulihkan.');
    }catch(e){alert('File backup tidak valid atau berisi data yang tidak didukung.')}
    finally{$('#impFile').value=''}
  };
  r.onerror=function(){$('#impFile').value='';alert('File tidak dapat dibaca.')};
  r.readAsText(file);
}
async function resetApp(){
  if(S.settings.pin){
    var entered=prompt('Masukkan PIN kasir untuk menghapus seluruh data:');
    if(entered===null||!await verifyPin(entered,S.settings.pin)){alert('PIN salah. Data tidak dihapus.');return}
  }
  if(!confirm('Hapus SEMUA data (produk, transaksi, pengaturan)? Tindakan ini tidak bisa dibatalkan.'))return;
  if(!confirm('Konfirmasi terakhir: pastikan backup JSON sudah disimpan di luar perangkat.'))return;
  try{
    localStorage.removeItem(LS_KEY);
    localStorage.removeItem(PIN_LOCK_KEY);
    localStorage.removeItem('skh_v2_last_backup');
    Object.keys(localStorage).filter(function(k){return k.indexOf('skh_v2_backup_')===0}).forEach(function(k){localStorage.removeItem(k)});
    location.reload();
  }catch(e){alert('Gagal menghapus data browser.')}
}

/* ================= pin / lock ================= */
function lockApp(){
  if(!S.settings.pin){alert('PIN belum aktif. Aktifkan di Atur → PIN.');return}
  $('#pinInput').value='';$('#pinErr').textContent='';
  $('#lock').classList.remove('hidden');
  setTimeout(function(){$('#pinInput').focus()},100);
}
async function unlock(){
  var throttle=readPinThrottle(),now=Date.now();
  if(now<throttle.blockedUntil){
    var seconds=Math.ceil((throttle.blockedUntil-now)/1000);
    $('#pinErr').textContent='Terlalu banyak percobaan. Coba lagi '+seconds+' detik.';
    return;
  }
  var v=$('#pinInput').value;
  if(await verifyPin(v,S.settings.pin)){
    if(S.settings.pin.indexOf('pbkdf2$')!==0){
      try{
        var old=S.settings.pin;
        S.settings.pin=await hashPin(v);
        if(!save()){S.settings.pin=old;return}
      }catch(e){$('#pinErr').textContent='PIN benar, tetapi browser tidak dapat mengamankan PIN. Gunakan HTTPS dan browser modern.';return}
    }
    writePinThrottle({fails:0,blockedUntil:0});
    $('#lock').classList.add('hidden');$('#pinInput').value='';$('#pinErr').textContent='';
  }else{
    throttle.fails++;
    if(throttle.fails>=5){
      throttle.blockedUntil=Date.now()+Math.min(30000*(throttle.fails-4),300000);
      $('#pinErr').textContent='PIN salah. Akses ditunda sementara.';
    }else{
      $('#pinErr').textContent='PIN salah ('+throttle.fails+'/5 percobaan)';
    }
    writePinThrottle(throttle);
    $('#pinInput').value='';
  }
}

/* ================= auto backup harian ================= */
function dailyBackup(){
  try{
    var today=ymd(new Date());
    if(localStorage.getItem('skh_v2_last_backup')!==today){
      localStorage.setItem('skh_v2_backup_'+today,JSON.stringify(S));
      localStorage.setItem('skh_v2_last_backup',today);
      var keys=[];
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf('skh_v2_backup_')===0)keys.push(k);
      }
      keys.sort();
      while(keys.length>7){localStorage.removeItem(keys.shift())}
    }
  }catch(e){}
}

/* ================= init ================= */
load();
$('#hName').textContent=S.settings.warung;
render();
dailyBackup();
if(S.settings.pin){
  $('#lock').classList.remove('hidden');
  setTimeout(function(){$('#pinInput').focus()},100);
}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('./sw.js').catch(function(){});
}
