name: POS Static QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/v2-ui-refresh"]

permissions:
  contents: read

jobs:
  static-qa:
    name: Static QA (PWA + JavaScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check QA script syntax
        run: node --check scripts/qa-static.mjs
      - name: Run static QA
        run: node scripts/qa-static.mjs
